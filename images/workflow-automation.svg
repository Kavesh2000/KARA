<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Automated business workflow concept</title>
  <desc id="desc">A connected process that collects a request, updates a team, and keeps records current.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2d8"/><stop offset="1" stop-color="#f4e5e9"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fffaf4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#32101c" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="850" rx="44" fill="url(#bg)"/>
  <circle cx="1030" cy="140" r="180" fill="#efa92d" opacity=".1"/><circle cx="176" cy="732" r="190" fill="#730223" opacity=".055"/>
  <text x="100" y="110" fill="#730223" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">FROM MANUAL STEPS TO MOMENTUM</text>
  <text x="100" y="161" fill="#301923" font-family="Arial,sans-serif" font-size="28" font-weight="700">One action sets the next in motion.</text>
